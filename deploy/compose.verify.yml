services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:${VERIFY_HTTP_PORT:?set VERIFY_HTTP_PORT}:80"
      - "127.0.0.1:${VERIFY_HTTPS_PORT:?set VERIFY_HTTPS_PORT}:443"
    volumes:
      - ${VERIFY_SITE_FILE:?set VERIFY_SITE_FILE}:/etc/nginx/conf.d/default.conf:ro
      - ${VERIFY_CERT_DIR:?set VERIFY_CERT_DIR}:/etc/nginx/verify-certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
