services:
  postgres:
    image: postgres:18
    env_file:
      - ${ENV_DIR:?set ENV_DIR}/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 384m
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    env_file:
      - ${ENV_DIR:?set ENV_DIR}/minio.env
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 384m
    restart: "no"

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ${ENV_DIR:?set ENV_DIR}/minio.env
    entrypoint: ["/bin/sh", "-c", "true"]
    restart: "no"

volumes:
  postgres_data:
  minio_data:
