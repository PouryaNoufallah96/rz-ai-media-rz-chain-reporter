name: rz-chain-reporter

# Deploy order: migrate, then template:reconcile from a checkout, then web and
# worker. Their prestart assertions refuse to start until the loaded template
# is the applied one, so bringing the stack up before reconciling fails loudly.

services:
  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
      args:
        CUSTOMER_TEMPLATE_KEY: ${CUSTOMER_TEMPLATE_KEY}
    environment:
      CUSTOMER_TEMPLATE_KEY: ${CUSTOMER_TEMPLATE_KEY}
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/rz-chain-reporter
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Unset stays empty (no compose interpolation failure); Dockerfile and
      # prestart reject an empty or mismatched key.
      args:
        CUSTOMER_TEMPLATE_KEY: ${CUSTOMER_TEMPLATE_KEY}
    init: true
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      CUSTOMER_TEMPLATE_KEY: ${CUSTOMER_TEMPLATE_KEY}
      BETTER_AUTH_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3001
      APP_URL: http://localhost:3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/rz-chain-reporter
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        CUSTOMER_TEMPLATE_KEY: ${CUSTOMER_TEMPLATE_KEY}
    init: true
    env_file:
      - path: apps/worker/.env
        required: true
    environment:
      CUSTOMER_TEMPLATE_KEY: ${CUSTOMER_TEMPLATE_KEY}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/rz-chain-reporter
      WEB_INTERNAL_BASE_URL: http://web:3001
      WORKER_HEALTH_PORT: 3002
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:18
    container_name: rz-chain-reporter-postgres
    environment:
      POSTGRES_DB: rz-chain-reporter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rz-chain-reporter_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: rz-chain-reporter-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-chainreporter}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-chainreporter-minio}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rz-chain-reporter_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: rz-chain-reporter-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-chainreporter}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-chainreporter-minio}
      S3_BUCKET: ${S3_BUCKET:-chainreporter-dev}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\";
      mc mb --ignore-existing \"local/$${S3_BUCKET}\";
      "
    restart: "no"

volumes:
  rz-chain-reporter_postgres_data:
  rz-chain-reporter_minio_data:
