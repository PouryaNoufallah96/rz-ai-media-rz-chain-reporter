<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/usr/local/share/fonts/chainreporter</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
  <match target="pattern">
    <test name="family" qual="any"><string>Geist</string></test>
    <edit name="family" mode="assign" binding="same"><string>Geist</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Vazirmatn</string></test>
    <edit name="family" mode="assign" binding="same"><string>Vazirmatn</string></edit>
  </match>
</fontconfig>
